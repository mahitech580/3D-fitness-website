name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  # Keep queued verification runs alive while rapid commits are pushed.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, build, and verify artifacts
        run: npm run check
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run production-preview interaction smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/kinetik-preview.log 2>&1 &
          echo $! > /tmp/kinetik-preview.pid
          trap 'kill "$(cat /tmp/kinetik-preview.pid)" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/3D-fitness-website/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/3D-fitness-website/ > /dev/null
          npm run test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetik-browser-smoke-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
