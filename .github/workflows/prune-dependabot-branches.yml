name: Keep work on main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prune-non-main-branches
  cancel-in-progress: true

jobs:
  prune-dependabot-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete dependency branches after consolidation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            case "$branch" in
              dependabot/*)
                encoded_ref="${branch//\//%2F}"
                echo "Removing superseded branch: $branch"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_ref}"
                ;;
              main)
                echo "Keeping main"
                ;;
            esac
          done
